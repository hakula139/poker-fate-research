[project]
name = "poker-fate-research"
version = "0.1.0"
description = "Poker Fate official API discovery and collection tooling"
requires-python = ">=3.12"

[project.scripts]
poker-fate-research = "poker_fate_research.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
