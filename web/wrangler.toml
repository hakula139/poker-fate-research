name = "poker-fate-stats"
main = "./worker/index.ts"
compatibility_date = "2026-06-18"
routes = [{ pattern = "poker-fate-stats.hakula.xyz", custom_domain = true }]
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
