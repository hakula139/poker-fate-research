name = "poker-fate-stats"
main = "./worker/index.ts"
compatibility_date = "2026-06-18"
routes = [{ pattern = "poker-fate-stats.hakula.xyz", custom_domain = true }]
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "poker-fate-stats"
database_id = "683c995d-799a-4f33-9200-6003fb4f22f7"

[observability.logs]
enabled = true

[env.preview]
name = "poker-fate-stats-preview"
workers_dev = true
routes = []

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "poker-fate-stats-preview"
database_id = "3b3e4027-2dad-47eb-b05f-591d3b354c28"

[env.preview.observability.logs]
enabled = true
