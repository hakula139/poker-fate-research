name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon

      - name: Run flake checks
        run: nix flake check --show-trace

      - name: Install web dependencies
        run: nix develop --command bash -lc 'cd web && pnpm install --frozen-lockfile'

      - name: Run web checks
        run: nix develop --command bash -lc 'cd web && pnpm run check'

      - name: Run web smoke test
        run: nix develop --command bash -lc 'cd web && pnpm run smoke'
