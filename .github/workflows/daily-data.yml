name: Daily data update

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      D1_DATABASE_NAME: poker-fate-stats
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon

      - name: Install web dependencies
        run: nix develop --command pnpm --dir web install --frozen-lockfile

      - name: Collect player snapshot
        env:
          POKER_FATE_RESEARCH_DEVICE_TOKEN: ${{ secrets.POKER_FATE_RESEARCH_DEVICE_TOKEN }}
        run: |
          test -n "$POKER_FATE_RESEARCH_DEVICE_TOKEN"
          nix develop --command uv --project python run poker-fate players

      - name: Build D1 import SQL
        run: |
          snapshot_path=$(find data/player-snapshots -name 'poker-fate-players-*.jsonl' | sort | tail -n 1)
          test -n "$snapshot_path"
          nix develop --command uv --project python run poker-fate d1-import-sql "$snapshot_path" --output work/d1-import.sql

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          nix develop --command bash -lc 'cd web && pnpm exec wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote'

      - name: Import D1 snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          nix develop --command bash -lc 'cd web && pnpm exec wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=../work/d1-import.sql'
