name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/web-build.yml
    with:
      upload-artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      WORKER_NAME: poker-fate-stats
      WORKERS_DEV_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN || 'hakula.workers.dev' }}
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip preview deploy
        if: env.CLOUDFLARE_CONFIGURED != 'true'
        run: echo "Cloudflare preview skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."

      - name: Checkout
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        uses: actions/checkout@v6

      - name: Set up pnpm
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.3

      - name: Set up Node.js
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Download web artifact
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Upload preview version
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: web
          wranglerVersion: '4.101.0'
          command: >-
            versions upload
            --preview-alias pr-${{ env.PR_NUMBER }}
            --message "PR #${{ env.PR_NUMBER }} @ ${{ env.PR_SHA }}"

      - name: Extract preview metadata
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        id: meta
        env:
          UPLOAD_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          version_id=$(awk '/Worker Version ID:/ {print $NF; exit}' <<<"$UPLOAD_OUTPUT")
          version_prefix="${version_id:0:8}"
          {
            echo "short_sha=${PR_SHA:0:7}"
            echo "version_url=https://${version_prefix}-${WORKER_NAME}.${WORKERS_DEV_SUBDOMAIN}"
            echo "alias_url=https://pr-${PR_NUMBER}-${WORKER_NAME}.${WORKERS_DEV_SUBDOMAIN}"
            echo "deploy_time=$(date -u +'%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-url
          message: |
            ## Cloudflare Workers preview

            <table>
              <tr>
                <td><strong>Preview</strong></td>
                <td><a href="${{ steps.meta.outputs.version_url }}">${{ steps.meta.outputs.version_url }}</a></td>
              </tr>
              <tr>
                <td><strong>Branch preview</strong></td>
                <td><a href="${{ steps.meta.outputs.alias_url }}">${{ steps.meta.outputs.alias_url }}</a></td>
              </tr>
              <tr>
                <td><strong>Commit</strong></td>
                <td><code>${{ steps.meta.outputs.short_sha }}</code></td>
              </tr>
              <tr>
                <td><strong>Updated</strong></td>
                <td>${{ steps.meta.outputs.deploy_time }}</td>
              </tr>
            </table>

            [View deploy logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
