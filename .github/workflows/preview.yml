name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/web-build.yml
    with:
      upload-artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      WORKER_NAME: poker-fate-stats
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: web
          wranglerVersion: '4.101.0'
          command: >-
            versions upload
            --preview-alias pr-${{ env.PR_NUMBER }}
            --message "PR #${{ env.PR_NUMBER }} @ ${{ env.PR_SHA }}"

      - name: Extract preview metadata
        id: meta
        env:
          UPLOAD_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          version_id=$(awk '/Worker Version ID:/ {print $NF; exit}' <<<"$UPLOAD_OUTPUT")
          version_prefix="${version_id:0:8}"
          test -n "$version_prefix"
          {
            echo "short_sha=${PR_SHA:0:7}"
            echo "version_id=${version_id}"
            echo "preview_alias=pr-${PR_NUMBER}"
            echo "deploy_time=$(date -u +'%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-url
          message: |
            ## Cloudflare Workers preview

            <table>
              <tr>
                <td><strong>Production URL</strong></td>
                <td><a href="https://poker-fate-stats.hakula.xyz/">https://poker-fate-stats.hakula.xyz/</a></td>
              </tr>
              <tr>
                <td><strong>Worker</strong></td>
                <td><code>${{ env.WORKER_NAME }}</code></td>
              </tr>
              <tr>
                <td><strong>Version</strong></td>
                <td><code>${{ steps.meta.outputs.version_id }}</code></td>
              </tr>
              <tr>
                <td><strong>Alias</strong></td>
                <td><code>${{ steps.meta.outputs.preview_alias }}</code></td>
              </tr>
              <tr>
                <td><strong>Commit</strong></td>
                <td><code>${{ steps.meta.outputs.short_sha }}</code></td>
              </tr>
              <tr>
                <td><strong>Updated</strong></td>
                <td>${{ steps.meta.outputs.deploy_time }}</td>
              </tr>
            </table>

            [View deploy logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
