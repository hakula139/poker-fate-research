[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poker-fate-research"
version = "0.1.0"
description = "Poker Fate API research collectors"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
poker-fate = "poker_fate_research.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.14.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/poker_fate_research"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP", "W"]
ignore = []

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = true
combine-as-imports = true
force-single-line = false
known-first-party = ["poker_fate_research"]
